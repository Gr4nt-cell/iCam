name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json', 'app.json', 'modules/**/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - name: Install dependencies
        run: |
          set -o pipefail
          npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tee -a build.log

      - name: Align Expo package versions
        run: |
          set -o pipefail
          npx expo install --fix -- --legacy-peer-deps 2>&1 | tee -a build.log

      - name: Type-check
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee -a build.log

      - name: Report CameraX versions
        run: |
          v=$(grep -nE "camera" node_modules/react-native-vision-camera/android/build.gradle | head -12 | awk '{printf "%s%%0A", $0}')
          echo "::notice title=VisionCamera CameraX deps::${v}"

      - name: Generate native Android project
        run: |
          set -o pipefail
          npx expo prebuild --platform android --clean --no-install 2>&1 | tee -a build.log

      - name: Build release APK (arm64 + x86_64)
        working-directory: android
        run: |
          set -o pipefail
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64 2>&1 | tee -a ../build.log

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/iCam-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: iCam-apk
          path: out/*.apk
          retention-days: 30

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch test on emulator
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -o pipefail
          bash .github/scripts/emulator.sh 2>&1 | tee emu.log || {
            msg=$(tail -30 emu.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=Emulator setup failed::${msg}"
            exit 1
          }

      # Turn the relevant error lines into annotations so they're readable from the run page / API
      - name: Report errors
        if: failure()
        run: |
          touch build.log
          grep -nE "error|Error|ERROR|FAILED|e: |Unresolved|What went wrong|Could not" build.log \
            | grep -vE "warning:|ERR_PNPM|errorprone" | tail -45 > errors.txt || true
          [ -s errors.txt ] || tail -40 build.log > errors.txt
          msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}' | cut -c1-60000)
          echo "::error title=Build errors::${msg}"
