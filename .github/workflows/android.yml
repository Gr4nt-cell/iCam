name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules/@angular /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google/chrome /usr/lib/jvm/temurin-8* /usr/lib/jvm/temurin-11* || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json', 'app.json', 'modules/**/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - name: Install dependencies
        run: |
          set -o pipefail
          npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tee -a build.log

      - name: Align Expo package versions
        run: |
          set -o pipefail
          npx expo install --fix -- --legacy-peer-deps 2>&1 | tee -a build.log

      - name: Type-check
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee -a build.log


      - name: Check native camera module is linked
        run: |
          npx expo-modules-autolinking search -p android 2>&1 | tee autolink.txt | grep -q icamera || {
            echo "::error title=Autolinking::icamera module not found by autolinking"
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        id: srmodel
        with:
          path: |
            modules/icamera/android/src/main/assets/realesr_general_x4v3.onnx
            modules/icamera/android/src/main/assets/gesture_recognizer.task
          key: models-sr-x4v3-gesture-v2

      # AI zoom model: Real-ESRGAN general x4v3 (BSD-3-Clause) converted to ONNX for ONNX Runtime
      - name: Build AI zoom model
        if: steps.srmodel.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p modules/icamera/android/src/main/assets
          # Palm shutter: MediaPipe gesture recognizer model (Apache-2.0)
          curl -sSfL -o modules/icamera/android/src/main/assets/gesture_recognizer.task \
            https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/latest/gesture_recognizer.task
          pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy onnx onnxruntime
          curl -sSL -o "$RUNNER_TEMP/sr.pth" https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
          mkdir -p modules/icamera/android/src/main/assets
          python scripts/export_sr_model.py "$RUNNER_TEMP/sr.pth" modules/icamera/android/src/main/assets/realesr_general_x4v3.onnx 2>&1 | tee -a build.log
          ls -la modules/icamera/android/src/main/assets
          # torch is ~2 GB: drop it before the Android build needs the disk
          pip uninstall -y torch onnx onnxruntime >/dev/null 2>&1 || true
          pip cache purge >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/sr.pth"
          df -h / | tail -1

      - name: Upload key (Play signing)
        env:
          KS_B64: ${{ secrets.ICAM_UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ICAM_UPLOAD_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ICAM_UPLOAD_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ICAM_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "ICAM_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "ICAM_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks"
              echo "ICAM_UPLOAD_STORE_PASSWORD=$KS_PASS"
              echo "ICAM_UPLOAD_KEY_ALIAS=$KS_ALIAS"
              echo "ICAM_UPLOAD_KEY_PASSWORD=${KS_KEY_PASS:-$KS_PASS}"
            } >> "$GITHUB_ENV"
            echo "::notice title=Signing::Release APK/AAB signed with the Play upload key"
          elif [ -f signing/icam-upload.jks ]; then
            # Upload key kept in this private repo
            {
              echo "ICAM_UPLOAD_STORE_FILE=$GITHUB_WORKSPACE/signing/icam-upload.jks"
              echo "ICAM_UPLOAD_STORE_PASSWORD=$(sed -n 's/^storePassword=//p' signing/upload.properties)"
              echo "ICAM_UPLOAD_KEY_ALIAS=$(sed -n 's/^keyAlias=//p' signing/upload.properties)"
              echo "ICAM_UPLOAD_KEY_PASSWORD=$(sed -n 's/^keyPassword=//p' signing/upload.properties)"
            } >> "$GITHUB_ENV"
            echo "::notice title=Signing::Release APK/AAB signed with the Play upload key (repo keystore)"
          else
            echo "::warning title=Signing::No upload key - AAB is debug-signed and Play will reject it."
          fi

      - name: Generate native Android project
        run: |
          set -o pipefail
          npx expo prebuild --platform android --clean --no-install 2>&1 | tee -a build.log

      - name: Build release APK + AAB
        working-directory: android
        run: |
          set -o pipefail
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          ./gradlew assembleRelease bundleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 2>&1 | tee -a ../build.log

      - name: Report what got linked
        if: always()
        continue-on-error: true
        run: |
          set +e +o pipefail
          enc() { sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          r=$(npx expo-modules-autolinking resolve -p android --json 2>&1 | tr ',' '\n' | grep -i -A3 "icamera" | head -20)
          echo "::notice title=Resolve (android)::$( (echo "${r:-icamera NOT in resolve output}") | enc)"
          p=$(cd android && ./gradlew -q projects --no-daemon 2>&1 | grep -i -E "icamera|expo-modules-core" | head -10)
          echo "::notice title=Gradle projects::$( (echo "${p:-no icamera gradle project}") | enc)"
          l=$(grep -rn "ICameraModule" node_modules/expo/android/build/generated android/app/build/generated 2>/dev/null | head -5)
          echo "::notice title=Module list::$( (echo "${l:-ICameraModule not in generated module list}") | enc)"
          c=$(find modules node_modules/icamera -name "ICamera*.class" 2>/dev/null | head -3)
          echo "::notice title=Compiled classes::$( (echo "${c:-no ICamera classes compiled}") | enc)"

      - name: Collect outputs
        run: |
          mkdir -p out/apk out/aab
          cp android/app/build/outputs/apk/release/app-release.apk "out/apk/iCam-${ICAM_VERSION_CODE}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/aab/iCam-${ICAM_VERSION_CODE}.aab"
          # R8 deobfuscation map: upload it in Play Console (App bundle explorer → Downloads) for readable crash reports
          cp android/app/build/outputs/mapping/release/mapping.txt "out/aab/mapping-${ICAM_VERSION_CODE}.txt" || true

      - name: Play pre-checks
        continue-on-error: true
        run: |
          set +e
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          APK=$(ls out/apk/*.apk)
          man=$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" 2>/dev/null)
          orient=$(echo "$man" | grep -c "screenOrientation")
          resize=$(echo "$man" | grep -A1 "resizeableActivity" | grep -c "0x0")
          vc=$("$BT/aapt2" dump badging "$APK" 2>/dev/null | head -1)
          sdk=$("$BT/aapt2" dump badging "$APK" 2>/dev/null | grep -E "targetSdkVersion|sdkVersion" | tr '\n' ' ')
          maplines=$(wc -l < out/aab/mapping-*.txt 2>/dev/null || echo 0)
          # share of app classes renamed by R8 (a, b, c... names)
          total=$(grep -c " -> " out/aab/mapping-*.txt 2>/dev/null || echo 0)
          renamed=$(grep -E "^[^ ].* -> [a-zA-Z0-9_.$]*\.?[a-z]{1,3}:$" out/aab/mapping-*.txt 2>/dev/null | wc -l)
          signer=$(keytool -printcert -jarfile out/aab/*.aab 2>/dev/null | grep -m1 -E "Owner|SHA256")
          orientv=$(echo "$man" | grep -A0 "screenOrientation" | head -2 | tr -s ' ')
          filters=$(echo "$man" | grep -c "IMAGE_CAPTURE\|VIDEO_CAPTURE\|STILL_IMAGE_CAMERA")
          echo "::notice title=Play pre-checks::$vc | $sdk | screenOrientation attrs: $orient | resizeableActivity=false: $resize | R8 classes renamed: $renamed / $total | orientation: $orientv | camera intent filters: $filters | signer: ${signer:-unsigned?}"

      - name: 16 KB page size check (Play requirement)
        id: pagesize
        continue-on-error: true
        run: |
          out=$(python3 scripts/check_16kb.py out/apk/*.apk 2>&1); code=$?
          echo "$out"
          msg=$(echo "$out" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ $code -eq 0 ]; then echo "::notice title=16 KB pages::$msg"; else echo "::error title=16 KB pages::$msg"; fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: iCam-apk
          path: out/apk/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: iCam-aab
          path: out/aab/*
          retention-days: 30

      - name: Free disk space for the emulator
        run: |
          rm -rf android/app/build/intermediates android/app/.cxx android/build node_modules/.cache || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch test on emulator
        continue-on-error: true
        timeout-minutes: 35
        run: |
          set -o pipefail
          bash .github/scripts/emulator.sh 2>&1 | tee emu.log || {
            msg=$(tail -45 emu.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=Emulator setup failed::${msg}"
            exit 1
          }

      # Turn the relevant error lines into annotations so they're readable from the run page / API
      - name: Report errors
        if: failure()
        run: |
          touch build.log
          { grep -E "^e: " build.log | head -40; grep -nE "FAILED|What went wrong|Could not|error TS" build.log | head -15; } > errors.txt || true
          [ -s errors.txt ] || tail -40 build.log > errors.txt
          msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}' | cut -c1-60000)
          echo "::error title=Build errors::${msg}"
